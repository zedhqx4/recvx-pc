```yaml
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_randomizer:
        description: Build cvx-rando.exe
        required: true
        type: boolean
        default: true
  push:
    branches:
      - pc-port
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET 10
        if: github.event_name != 'workflow_dispatch' || inputs.build_randomizer
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply temporary MSVC environment fix
        shell: powershell
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE "pc/tools/msvc.py"

          $source = Get-Content $file -Raw

          $old = 'exe = shutil.which(args[0], path=env["PATH"]) or args[0]'
          $new = @'
          path = next((v for k, v in env.items() if k.casefold() == "path"), "")
              exe = shutil.which(args[0], path=path) or args[0]
          '@.Trim()

          if (-not $source.Contains($old)) {
            throw "Expected MSVC code was not found; refusing to modify the file."
          }

          $source = $source.Replace($old, $new)
          Set-Content -Path $file -Value $source -Encoding utf8 -NoNewline

      - name: Build game and randomizer
        if: github.event_name != 'workflow_dispatch' || inputs.build_randomizer
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build game only
        if: github.event_name == 'workflow_dispatch' && !inputs.build_randomizer
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes -NoRando
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recvx-pc-windows
          path: build_pc/
          if-no-files-found: error
