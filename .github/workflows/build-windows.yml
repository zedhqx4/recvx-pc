name: Build recvx-pc for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - pc-port
      - graphics-fixes
      - SDL3
      - performance-sdl3
      - experiment/gs-block-upload
      - experiment/texture-cache-index
      - experiment/texture-cache-gl-state
      - experiment/clut-identical-skip
      - experiment/ps2-tex-cache
      - alpha
      - experimental/workbench-rendering
      - experimental/opengl-4.3
      - review/claude-opengl-4.3
      - c3853984-baseline
      - merge-c3853984-into-graphics-fixes
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply temporary MSVC fix
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'pc/tools/msvc.py'
          $source = Get-Content $file -Raw

          $old = '    exe = shutil.which(args[0], path=env["PATH"]) or args[0]'
          $new = '    path = next((v for k, v in env.items() if k.casefold() == "path"), "")' + [Environment]::NewLine + '    exe = shutil.which(args[0], path=path) or args[0]'

          if (-not $source.Contains($old)) {
            throw 'Expected MSVC code not found; refusing to patch.'
          }

          $source = $source.Replace($old, $new)
          Set-Content -Path $file -Value $source -Encoding utf8 -NoNewline

      - name: Build game
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes -NoRando
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify experimental build files before startup test
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build_pc'
          $required = @('recvx.exe', 'recvx-config.exe', 'SDL3.dll', 'libusb-1.0.dll')
          foreach ($name in $required) {
            $file = Join-Path $dir $name
            if (-not (Test-Path $file)) {
              throw "Expected build artifact not found: $file"
            }
          }

      - name: Smoke-test executable startup
        id: smoke-test
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build_pc'
          $exe = Join-Path $dir 'recvx.exe'
          $trace = Join-Path $dir 'recvx-startup.log'
          $log = Join-Path $dir 'recvx.log'
          Remove-Item $trace, $log -Force -ErrorAction SilentlyContinue

          # The runner has no game disc, so the app may stop at the setup prompt.
          # Verify startup reaches SDL, creates an OpenGL context, and record any earlier failure.
          $proc = Start-Process -FilePath $exe -WorkingDirectory $dir -PassThru -WindowStyle Hidden
          try {
            $null = $proc.WaitForExit(10000)
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              $proc.WaitForExit()
            }
          }

          if (Test-Path $trace) {
            Write-Host '--- recvx-startup.log ---'
            Get-Content $trace
          } else {
            throw 'recvx-startup.log was not created: recvx did not reach main(), or could not write beside the executable.'
          }
          if (Test-Path $log) {
            Write-Host '--- recvx.log ---'
            Get-Content $log -Tail 100
          }
          if (-not (Select-String -Path $trace -Pattern 'main entered' -Quiet)) {
            throw 'The startup trace does not confirm entry to main().'
          }
          if (-not (Select-String -Path $trace -Pattern 'pcVideoInit: OpenGL context created' -Quiet)) {
            throw 'recvx did not reach a working SDL window and OpenGL context; see the startup trace above.'
          }
          if (-not (Select-String -Path $trace -Pattern 'pcVideoInit: OpenGL version verified:' -Quiet)) {
            throw 'recvx did not verify an OpenGL 4.3 Core context; see the startup trace above.'
          }
          Write-Host 'Startup smoke test passed: main, SDL initialization, window, and OpenGL context.'

      - name: Verify executables and collect build metadata
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build_pc'
          $required = @('recvx.exe', 'recvx-config.exe', 'SDL3.dll', 'libusb-1.0.dll')

          foreach ($name in $required) {
            $file = Join-Path $dir $name
            if (-not (Test-Path $file)) {
              throw "Expected build artifact not found: $file"
            }
            Write-Host "Found: $file"
          }

          $commitMessage = git log -1 --pretty=%s
          $builtAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          $metadata = @(
            'recvx-pc Windows build'
            "Branch: $env:GITHUB_REF_NAME"
            "Commit: $env:GITHUB_SHA"
            "Commit message: $commitMessage"
            "Built at (UTC): $builtAt"
            "Workflow: $env:GITHUB_WORKFLOW"
            "Run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            ''
            'SHA256:'
          )

          foreach ($name in $required) {
            $hash = (Get-FileHash (Join-Path $dir $name) -Algorithm SHA256).Hash
            $metadata += "$hash  $name"
          }

          $metadata | Set-Content -Path (Join-Path $dir 'BUILD_INFO.txt') -Encoding utf8
          Write-Host '--- BUILD_INFO.txt ---'
          Get-Content (Join-Path $dir 'BUILD_INFO.txt')

      - name: Prepare artifact name
        id: artifact-meta
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          "name=recvx-pc_$($branch)_$($commit)" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload Windows build and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: |
            build_pc/recvx.exe
            build_pc/recvx-config.exe
            build_pc/SDL3.dll
            build_pc/libusb-1.0.dll
            build_pc/BUILD_INFO.txt
            build_pc/recvx-startup.log
            build_pc/recvx.log
          if-no-files-found: error

      - name: Report startup smoke-test failure after artifact upload
        if: always() && steps.smoke-test.outcome == 'failure'
        shell: pwsh
        run: |
          throw 'Startup smoke test failed. The compiled artifact and diagnostic logs were uploaded; inspect recvx-startup.log and recvx.log.'
