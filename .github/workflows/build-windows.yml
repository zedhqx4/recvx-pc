name: Build recvx-pc for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - pc-port
      - experimental/gs-rebuild
      - experiment/gs-rebuild-psmt-block256
      - FONTFix
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply temporary MSVC fix
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'pc/tools/msvc.py'
          $source = Get-Content $file -Raw

          $old = '    exe = shutil.which(args[0], path=env["PATH"]) or args[0]'
          $new = '    path = next((v for k, v in env.items() if k.casefold() == "path"), "")' + "`r`n" + '    exe = shutil.which(args[0], path=path) or args[0]'

          if (-not $source.Contains($old)) {
            throw 'Expected MSVC code not found; refusing to patch.'
          }

          $source = $source.Replace($old, $new)
          Set-Content -Path $file -Value $source -Encoding utf8 -NoNewline

      - name: Build game
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes -NoRando
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Verify executables
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build_pc'
          $required = @('recvx.exe', 'recvx-config.exe', 'SDL3.dll', 'libusb-1.0.dll')

          foreach ($name in $required) {
            $file = Join-Path $dir $name
            if (-not (Test-Path $file)) {
              throw "Expected executable not found: $file"
            }
            Write-Host "Found: $file"
          }

          Get-ChildItem $dir -File

      - name: Prepare artifact name
        id: artifact-meta
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-'
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          "name=recvx-pc_${branch}_${commit}" | Add-Content -Path $env:GITHUB_OUTPUT

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-meta.outputs.name }}
          path: |
            build_pc/recvx.exe
            build_pc/recvx-config.exe
            build_pc/SDL3.dll
            build_pc/libusb-1.0.dll
          if-no-files-found: error

  gs-blockpath-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare block fast path with per-pixel reference
        run: |
          cc -O2 -DGS_BLOCK_FASTPATH=1 pc/tests/gs_mem_blockpath_test.c -o /tmp/gs-block-fast
          cc -O2 -DGS_BLOCK_FASTPATH=0 pc/tests/gs_mem_blockpath_test.c -o /tmp/gs-block-reference
          /tmp/gs-block-fast > /tmp/gs-block-fast.txt
          /tmp/gs-block-reference > /tmp/gs-block-reference.txt
          diff -u /tmp/gs-block-reference.txt /tmp/gs-block-fast.txt
          cat /tmp/gs-block-fast.txt
