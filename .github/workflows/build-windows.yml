
name: Build Windows

on:
  workflow_dispatch:
    inputs:
      build_randomizer:
        description: Build cvx-rando.exe
        required: true
        type: boolean
        default: true
  push:
    branches:
      - pc-port
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up .NET 10
        if: github.event_name != 'workflow_dispatch' || inputs.build_randomizer
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build game and randomizer
        if: github.event_name != 'workflow_dispatch' || inputs.build_randomizer
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build game only
        if: github.event_name == 'workflow_dispatch' && !inputs.build_randomizer
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes -NoRando
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recvx-pc-windows
          path: build_pc/
          if-no-files-found: error
