name: Build recvx-pc for Windows (compile only)

on:
  workflow_dispatch:
  push:
    branches:
      - OpenGl-3.3
    paths:
      - 'pc/src/**'
      - 'pc/include/**'
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - 'build.ps1'
      - 'build.bat'
      - 'pc/tools/**'
      - '.github/workflows/build-windows-compile-only.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply temporary MSVC fix
        shell: pwsh
        run: |
          $file = Join-Path $env:GITHUB_WORKSPACE 'pc/tools/msvc.py'
          $source = Get-Content $file -Raw
          $old = '    exe = shutil.which(args[0], path=env["PATH"]) or args[0]'
          $new = '    path = next((v for k, v in env.items() if k.casefold() == "path"), "")' + "`r`n" + '    exe = shutil.which(args[0], path=path) or args[0]'
          if (-not $source.Contains($old)) { throw 'Expected MSVC code not found; refusing to patch.' }
          $source = $source.Replace($old, $new)
          Set-Content -Path $file -Value $source -Encoding utf8 -NoNewline

      - name: Build game
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\build.ps1" -Yes -NoRando
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify build artifacts
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'build_pc'
          $required = @('recvx.exe', 'recvx-config.exe', 'SDL3.dll', 'libusb-1.0.dll')
          foreach ($name in $required) {
            $file = Join-Path $dir $name
            if (-not (Test-Path $file)) { throw "Expected build artifact not found: $file" }
            Write-Host "Verified: $file"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: recvx-pc-windows-opengl-3.3-compile-only
          path: |
            build_pc/recvx.exe
            build_pc/recvx-config.exe
            build_pc/SDL3.dll
            build_pc/libusb-1.0.dll
          if-no-files-found: error
